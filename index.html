<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中醫處方分組與每日劑量換算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-6 border-b border-slate-200">
      <div>
        <div class="flex items-center gap-2">
          <span class="p-2 bg-emerald-600 text-white rounded-lg shadow-sm">
            <i class="fa-solid fa-mortar-pestle text-xl"></i>
          </span>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">中醫處方分組與每日劑量換算器</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">自動解析 HIS 複製處方，支援水煎飲片（錢）與濃縮粉劑（g）獨立分組換算</p>
      </div>
      <div class="flex items-center gap-2 mt-4 md:mt-0">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <i class="fa-solid fa-shield-halved mr-1"></i> 本機離線運算 · 隱私無虞
        </span>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Input Panel (5 cols) -->
      <div class="lg:col-span-5 flex flex-col gap-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <div class="flex items-center justify-between mb-3">
            <label for="hisInput" class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
              <i class="fa-solid fa-clipboard-list text-emerald-600"></i> HIS 處方貼上區
            </label>
            <div class="flex gap-2">
              <button id="btnSamplePowder" class="text-xs text-slate-600 hover:text-emerald-700 bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded transition">
                範例粉劑
              </button>
              <button id="btnSampleHerb" class="text-xs text-slate-600 hover:text-emerald-700 bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded transition">
                範例飲片
              </button>
              <button id="btnClear" class="text-xs text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-2 py-1 rounded transition">
                清空
              </button>
            </div>
          </div>

          <textarea id="hisInput" rows="14" class="w-full text-xs font-mono-code p-3.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition placeholder:text-slate-400 leading-relaxed resize-y" placeholder="請直接從 HIS 處方清單反白複製並貼在此處...
支援：
1. 逐行複製貼上格式（每格一行）
2. 傳統 Tab 分隔表格"></textarea>

          <!-- Configuration Controls -->
          <div class="mt-4 pt-4 border-t border-slate-100 space-y-2.5">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">轉換設定</div>
            
            <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-700 hover:text-slate-900">
              <input type="checkbox" id="optNormalizeName" checked class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300">
              <span>中藥名智慧標準化（如：地黃(生)➔生地、(炒)杜仲(自)➔炒杜仲、去除☆與自費標記）</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-700 hover:text-slate-900">
              <input type="checkbox" id="optCleanBrackets" checked class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300">
              <span>清除其餘剩餘括號註記（如：黃柏(川)➔黃柏）</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-700 hover:text-slate-900">
              <input type="checkbox" id="optTrimZero" checked class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300">
              <span>劑量維持至少一位小數（如 1.0g、2.0錢）</span>
            </label>
          </div>

          <button id="btnParse" class="mt-4 w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-bolt"></i> 解析並依頻次天數分組
          </button>
        </div>
      </div>

      <!-- Result Panel (7 cols) -->
      <div class="lg:col-span-7 flex flex-col gap-4">
        
        <!-- Output Summary Card -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                <i class="fa-solid fa-file-lines text-emerald-600"></i> 病歷處方輸出格式
              </h2>
              <span id="badgeCount" class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full font-medium hidden">0 組</span>
            </div>
            <button id="btnCopyAll" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-regular fa-clone"></i> 複製全部輸出文字
            </button>
          </div>

          <div id="quickOutputContainer" class="space-y-3">
            <div class="text-center py-12 text-slate-400 text-sm">
              <i class="fa-solid fa-arrow-left text-2xl mb-2 text-slate-300 block"></i>
              請在左側貼入 HIS 處方文字並點擊「解析」
            </div>
          </div>
        </div>

        <!-- Detailed Audit Groups -->
        <div id="groupsDetailContainer" class="space-y-4">
          <!-- Dynamic group cards rendered here -->
        </div>

      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 z-50">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">已複製到剪貼簿</span>
  </div>

  <script>
    // 預設頻次對應每日服用次數表
    const FREQ_MAP = {
      'QD': 1, 'HS': 1, 'QN': 1, 'QAM': 1, 'QPM': 1, 'PRN': 1,
      'BID': 2,
      'TID': 3,
      'QID': 4,
      'QOD': 0.5,
      'QW': 0.14
    };

    // 智能簡稱對照表
    const SMART_NAME_MAP = {
      '地黃(生)': '生地',
      '芍藥(赤)': '赤芍',
      '芍藥(白)': '白芍',
      '黃柏(川)': '黃柏',
      '天花粉(栝樓根)': '天花粉',
      '生薑(煨)': '煨生薑',
      '酸棗仁(炒)': '炒棗仁',
      '薏苡仁(炒)': '炒薏仁'
    };

    // 範例資料：濃縮粉劑
    const SAMPLE_POWDER = `醫令代碼\n註\n醫令學名及單位\n每次\n單位\n用法\n天數\n途徑\n時間\n總量\nCPDGP\n \n地骨皮\n1.5\nGM\nHS\n28\nPO\nPC\n42.0\nCPHB\n \n黃柏(川)\n1.5\nGM\nHS\n28\nPO\nPC\n42.0\nCPMMD\n \n麥門冬\n1.0\nGM\nHS\n28\nPO\nPC\n28.0\nCPPGI\n \n蒲公英\n0.75\nGM\nBID\n28\nPO\nPC\n42.0\nCPHPSH\n \n海螵蛸\n1.0\nGM\nBID\n28\nPO\nPC\n56.0\nCPIUJ\n \n玉竹\n1.0\nGM\nBID\n28\nPO\nPC\n56.0\nCPFSH2\n \n茯神\n1.0\nGM\nHS\n28\nPO\nPC\n28.0\nCPDH1\n \n地黃(生)\n1.0\nGM\nHS\n28\nPO\nPC\n28.0\nCPLG2\n \n蘆根\n0.75\nGM\nBID\n28\nPO\nPC\n42.0\nCPHSH1\n \n藿香\n0.5\n克\nBID\n28\nPO\nPC\n28.0\nCPSHICH\n \n芍藥(赤)\n1.0\nGM\nHS\n28\nPO\nPC\n28.0\nCPTM1\n \n天麻\n0.5\n克\nBID\n28\nPO\nPC\n28.0\nCPMHG\n \n麻黃根\n1.5\nGM\nHS\n28\nPO\nPC\n42.0\nCPMDP\n \n牡丹皮\n0.5\nGM\nBID\n28\nPO\nPC\n28.0\nCPTHF\n \n天花粉(栝樓根)\n1.0\nGM\nHS\n28\nPO\nPC\n28.0\nCPSHFDJT\n \n旋覆代赭石湯\n1.75\nGM\nBID\n28\nPO\nPC\n98.0\nCPJUSHIS\n \n加味逍遙散\n1.0\nGM\nBID\n28\nPO\nPC\n56.0`;

    // 範例資料：生藥材飲片
    const SAMPLE_HERB = `CHDG\n \n當歸(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHNJTZ\n \n女貞子(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHHLTS\n \n旱蓮草(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHCHCHIU\n \n川芎(酒)(自)\n1.0\n錢\nBID\n14\nPO\nPC\n28.0\nCHSHI\n \n山藥(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHFSH2\n \n☆茯神(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHCHP3\n \n陳皮(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHSHF\n \n香附(製)(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHHCH\n \n黃耆(生)(自)\n1.75\n錢\nBID\n14\nPO\nPC\n49.0\nCHSHH\n \n石斛(釵)(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHDS2\n \n黨參(自)\n1.5\n錢\nBID\n14\nPO\nPC\n42.0\nCHDJ2\n \n(炒)杜仲(自)\n1.75\n錢\nBID\n14\nPO\nPC\n49.0\nCHGTSJ\n \n(炙)甘草(自)\n0.75\n錢\nBID\n14\nPO\nPC\n21.0\nCHSHICH\n \n(赤)芍藥(自)\n1.0\n錢\nBID\n14\nPO\nPC\n28.0`;

    // 元素參照
    const hisInput = document.getElementById('hisInput');
    const btnParse = document.getElementById('btnParse');
    const btnClear = document.getElementById('btnClear');
    const btnSamplePowder = document.getElementById('btnSamplePowder');
    const btnSampleHerb = document.getElementById('btnSampleHerb');
    const btnCopyAll = document.getElementById('btnCopyAll');
    const quickOutputContainer = document.getElementById('quickOutputContainer');
    const groupsDetailContainer = document.getElementById('groupsDetailContainer');
    const badgeCount = document.getElementById('badgeCount');
    const optNormalizeName = document.getElementById('optNormalizeName');
    const optCleanBrackets = document.getElementById('optCleanBrackets');
    const optTrimZero = document.getElementById('optTrimZero');

    // 儲存目前解析群組資料
    let currentParsedGroups = [];

    // 載入預設
    btnSamplePowder.addEventListener('click', () => {
      hisInput.value = SAMPLE_POWDER;
      parseAndRender();
    });

    btnSampleHerb.addEventListener('click', () => {
      hisInput.value = SAMPLE_HERB;
      parseAndRender();
    });

    btnClear.addEventListener('click', () => {
      hisInput.value = '';
      quickOutputContainer.innerHTML = `
        <div class="text-center py-12 text-slate-400 text-sm">
          <i class="fa-solid fa-arrow-left text-2xl mb-2 text-slate-300 block"></i>
          請在左側貼入 HIS 處方文字並點擊「解析」
        </div>
      `;
      groupsDetailContainer.innerHTML = '';
      badgeCount.classList.add('hidden');
      btnCopyAll.disabled = true;
      currentParsedGroups = [];
    });

    btnParse.addEventListener('click', parseAndRender);
    [optNormalizeName, optCleanBrackets, optTrimZero].forEach(el => {
      el.addEventListener('change', () => {
        if (hisInput.value.trim()) parseAndRender();
      });
    });

    // 核心解析邏輯
    function parseAndRender() {
      const text = hisInput.value.trim();
      if (!text) {
        showToast('請先貼入處方文字');
        return;
      }

      const rows = extractPrescriptionRows(text);
      if (rows.length === 0) {
        quickOutputContainer.innerHTML = `
          <div class="text-center py-8 text-rose-500 text-sm">
            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 block"></i>
            未能解析出有效藥物，請確認複製格式是否包含藥名、劑量、頻次與天數。
          </div>
        `;
        groupsDetailContainer.innerHTML = '';
        btnCopyAll.disabled = true;
        badgeCount.classList.add('hidden');
        return;
      }

      // 依 【類別 (粉劑/飲片) + 頻次 + 天數】 進行分組
      const groupsMap = new Map();

      rows.forEach(item => {
        const isDecoction = item.unit === '錢' || item.unit === '兩';
        const typeLabel = isDecoction ? '飲片' : '粉劑';
        const unitSymbol = isDecoction ? '錢' : 'g';
        const groupKey = `${typeLabel}__${item.freq}__${item.days}`;

        if (!groupsMap.has(groupKey)) {
          groupsMap.set(groupKey, {
            key: groupKey,
            type: typeLabel,
            unitSymbol: unitSymbol,
            freq: item.freq,
            days: item.days,
            timesPerDay: getTimesPerDay(item.freq),
            items: []
          });
        }

        const group = groupsMap.get(groupKey);
        const dailyDose = round(item.singleDose * group.timesPerDay, 3);
        const cleanedName = cleanMedicineName(item.rawName);

        group.items.push({
          ...item,
          displayName: cleanedName,
          dailyDose: dailyDose
        });
      });

      // 排序分組：飲片在前或粉劑在前可視慣例，此處依天數及頻次次數排序
      currentParsedGroups = Array.from(groupsMap.values()).sort((a, b) => {
        if (a.type !== b.type) return a.type === '粉劑' ? -1 : 1; // 粉劑優先
        if (b.timesPerDay !== a.timesPerDay) return b.timesPerDay - a.timesPerDay;
        return b.days - a.days;
      });

      renderResults(currentParsedGroups);
    }

    // 將輸入字串轉化為標準結構列
    function extractPrescriptionRows(rawText) {
      const lines = rawText.split(/\r?\n/).map(l => l.replace(/\u00A0/g, ' ').trim());
      const hasTab = rawText.includes('\t');

      if (hasTab) {
        // Tab 分隔表格解析
        return parseTabDelimited(lines);
      } else {
        // 逐行複製解析
        return parseSequentialLines(lines);
      }
    }

    // 處理逐行垂直排列格式
    function parseSequentialLines(lines) {
      // 過濾掉全空列
      const cleanLines = lines.filter(l => l !== '');
      const results = [];
      
      // 常見頻次集合
      const knownFreqs = new Set(['QD', 'HS', 'QN', 'BID', 'TID', 'QID', 'PRN', 'QOD', 'QAM', 'QPM']);
      const knownUnits = new Set(['GM', 'G', '克', '公克', '錢', '兩', '粒', '包', '片', 'ML', 'CC']);

      let i = 0;
      while (i < cleanLines.length) {
        const line = cleanLines[i];

        // 偵測是否為頻次
        const freqCandidate = line.toUpperCase();
        if (knownFreqs.has(freqCandidate) && i >= 3) {
          const freq = freqCandidate;
          const unit = cleanLines[i - 1];
          const singleDoseStr = cleanLines[i - 2];
          const singleDose = parseFloat(singleDoseStr);

          // 往後尋找天數 (通常在 freq 緊接的下一個數字)
          let days = 28; // fallback
          if (i + 1 < cleanLines.length && /^\d+$/.test(cleanLines[i + 1])) {
            days = parseInt(cleanLines[i + 1], 10);
          }

          // 往前尋找藥名
          let rawName = cleanLines[i - 3];
          let code = '';
          if (i >= 5 && isLikelyCode(cleanLines[i - 5])) {
            code = cleanLines[i - 5];
          } else if (i >= 4 && isLikelyCode(cleanLines[i - 4])) {
            code = cleanLines[i - 4];
          }

          if (!isNaN(singleDose) && rawName && !isHeaderWord(rawName)) {
            // 確認 unit 是否合理
            const cleanUnit = knownUnits.has(unit.toUpperCase()) ? unit : 'GM';
            results.push({
              code: code,
              rawName: rawName,
              singleDose: singleDose,
              unit: cleanUnit,
              freq: freq,
              days: days
            });
          }
        }
        i++;
      }
      return results;
    }

    // 處理 Tab 表格形式
    function parseTabDelimited(lines) {
      const results = [];
      const knownFreqs = new Set(['QD', 'HS', 'QN', 'BID', 'TID', 'QID', 'PRN', 'QOD', 'QAM', 'QPM']);

      for (let line of lines) {
        if (!line) continue;
        const cols = line.split('\t').map(c => c.trim());
        if (cols.length < 5) continue;

        // 尋找各欄位位置
        let name = '', singleDose = NaN, unit = 'GM', freq = '', days = 28, code = '';
        
        // 尋找頻次欄
        let freqIdx = cols.findIndex(c => knownFreqs.has(c.toUpperCase()));
        if (freqIdx !== -1) {
          freq = cols[freqIdx].toUpperCase();
          if (freqIdx >= 2) {
            singleDose = parseFloat(cols[freqIdx - 2]);
            unit = cols[freqIdx - 1];
          }
          if (freqIdx + 1 < cols.length && /^\d+$/.test(cols[freqIdx + 1])) {
            days = parseInt(cols[freqIdx + 1], 10);
          }
          if (freqIdx >= 3) {
            name = cols[freqIdx - 3];
          }
          if (freqIdx >= 5) {
            code = cols[0];
          }
        }

        if (name && !isNaN(singleDose) && freq && !isHeaderWord(name)) {
          results.push({
            code: code,
            rawName: name,
            singleDose: singleDose,
            unit: unit,
            freq: freq,
            days: days
          });
        }
      }
      return results;
    }

    function isLikelyCode(str) {
      return /^[A-Z0-9_\-]{3,12}$/i.test(str);
    }

    function isHeaderWord(str) {
      return ['醫令學名及單位', '醫令學名', '每次', '用法', '天數', '總量', '藥品名稱'].includes(str);
    }

    function getTimesPerDay(freq) {
      return FREQ_MAP[freq.toUpperCase()] || 1;
    }

    // 中藥品名清理與修飾
    function cleanMedicineName(raw) {
      let name = raw.trim();

      // 移除前綴符號如 ☆, ★, 空白
      name = name.replace(/^[☆★\*\s]+/, '');

      // 移除 (自) 標記
      name = name.replace(/\(自\)/g, '').replace(/（自）/g, '');

      // 智能中藥名簡化
      if (optNormalizeName.checked) {
        if (SMART_NAME_MAP[name]) {
          return SMART_NAME_MAP[name];
        }

        // 針對飲片常見前綴與後綴修飾：如 (炒)杜仲 -> 炒杜仲, (炙)甘草 -> 炙甘草, (赤)芍藥 -> 赤芍
        name = name.replace(/^\(([炒炙生酒製煨酒蒸])\)(.+)/, '$1$2');
        name = name.replace(/^（([炒炙生酒製煨酒蒸])）(.+)/, '$1$2');

        // 針對中綴修飾：如 黃耆(生) -> 生黃耆, 香附(製) -> 製香附, 川芎(酒) -> 酒川芎
        const suffixMatch = name.match(/^(.+?)\(([生炒製酒炙煨])\)$/);
        if (suffixMatch) {
          name = suffixMatch[2] + suffixMatch[1];
        }
        
        // 特殊對照再過濾
        if (name === '生地黃') name = '生地';
        if (name === '赤芍藥') name = '赤芍';
        if (name === '白芍藥') name = '白芍';
      }

      // 若開啟清除其餘剩餘括號（如 黃柏(川) -> 黃柏, 石斛(釵) -> 石斛）
      if (optCleanBrackets.checked) {
        name = name.replace(/\(.*?\)/g, '').replace(/（.*?）/g, '').trim();
      }

      return name;
    }

    // 格式化劑量
    function formatDose(num) {
      if (optTrimZero.checked) {
        return num.toFixed(1);
      }
      return parseFloat(num.toFixed(2)).toString();
    }

    function round(num, decimals = 2) {
      const factor = Math.pow(10, decimals);
      return Math.round(num * factor) / factor;
    }

    // 渲染結果
    function renderResults(groups) {
      quickOutputContainer.innerHTML = '';
      groupsDetailContainer.innerHTML = '';
      badgeCount.textContent = `${groups.length} 個分組`;
      badgeCount.classList.remove('hidden');
      btnCopyAll.disabled = false;

      let allTextLines = [];

      groups.forEach((group, idx) => {
        // 1. 生成該組單行格式：蒲公英1.5g 海螵蛸2.0g ... BID*28天
        const itemsText = group.items
          .map(it => `${it.displayName}${formatDose(it.dailyDose)}${group.unitSymbol}`)
          .join(' ');
        
        const lineOutput = `${itemsText}  ${group.freq}*${group.days}天`;
        allTextLines.push(lineOutput);

        // 2. 累計數值計算
        const groupDailyTotal = round(group.items.reduce((sum, it) => sum + it.dailyDose, 0), 2);
        const groupSingleDoseTotal = round(groupDailyTotal / group.timesPerDay, 2);

        // 3. 渲染快速預覽項目
        const isDecoction = group.type === '飲片';
        const typeBadgeColor = isDecoction 
          ? 'bg-amber-100 text-amber-800 border-amber-300' 
          : 'bg-emerald-100 text-emerald-800 border-emerald-300';

        const quickCard = document.createElement('div');
        quickCard.className = 'p-3.5 bg-slate-50 border border-slate-200 rounded-lg transition hover:border-slate-300';
        quickCard.innerHTML = `
          <div class="flex items-center justify-between text-xs mb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded text-[11px] font-semibold border ${typeBadgeColor}">
                ${group.type}
              </span>
              <span class="font-bold text-slate-700">${group.freq}</span>
              <span class="text-slate-400">·</span>
              <span class="text-slate-600">${group.days} 天</span>
              <span class="text-slate-400">·</span>
              <span class="text-slate-500">${group.items.length} 味藥</span>
            </div>
            <button class="btnCopyLine text-xs text-slate-600 hover:text-emerald-700 font-medium px-2 py-1 rounded bg-white hover:bg-slate-100 border border-slate-200 shadow-2xs transition" data-line="${escapeHtml(lineOutput)}">
              <i class="fa-regular fa-copy"></i> 複製此行
            </button>
          </div>
          <div class="text-sm font-mono-code font-medium text-slate-900 break-all leading-relaxed bg-white p-2.5 rounded border border-slate-200 select-all">
            ${escapeHtml(lineOutput)}
          </div>
        `;
        quickOutputContainer.appendChild(quickCard);

        // 4. 渲染防呆核對詳細表格卡片
        const detailCard = document.createElement('div');
        detailCard.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden';
        
        let tableRowsHtml = group.items.map((it, itemIdx) => {
          return `
            <tr class="hover:bg-slate-50 transition border-b border-slate-100 last:border-b-0 text-xs">
              <td class="py-2.5 px-3 font-mono text-slate-400 text-center">${itemIdx + 1}</td>
              <td class="py-2.5 px-3 font-medium text-slate-800">
                <div class="flex items-center gap-1.5">
                  <span>${escapeHtml(it.displayName)}</span>
                  ${it.displayName !== it.rawName ? `<span class="text-[10px] text-slate-400 font-normal">(${escapeHtml(it.rawName)})</span>` : ''}
                </div>
              </td>
              <td class="py-2.5 px-3 text-right font-mono text-slate-600">${it.singleDose} <span class="text-[10px] text-slate-400">${it.unit}</span></td>
              <td class="py-2.5 px-3 text-center text-slate-600 font-mono">× ${group.timesPerDay}</td>
              <td class="py-2.5 px-3 text-right font-mono font-bold text-emerald-700 bg-emerald-50/40">${formatDose(it.dailyDose)} <span class="text-[10px]">${group.unitSymbol}</span></td>
              <td class="py-2.5 px-3 text-right font-mono text-slate-500">${round(it.dailyDose * group.days, 1)} ${group.unitSymbol}</td>
            </tr>
          `;
        }).join('');

        detailCard.innerHTML = `
          <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-xs font-semibold border ${typeBadgeColor}">
                ${group.type}
              </span>
              <span class="font-bold text-slate-800 text-sm">${group.freq} · ${group.days} 天</span>
              <span class="text-xs text-slate-500">（每日服 ${group.timesPerDay} 次）</span>
            </div>
            <div class="flex items-center gap-4 text-xs font-medium">
              <span class="text-slate-600">
                單日總量: <strong class="text-slate-900 font-mono text-sm">${groupDailyTotal}</strong> ${group.unitSymbol}
              </span>
              <span class="text-slate-600">
                單次/單包量: <strong class="text-slate-900 font-mono text-sm">${groupSingleDoseTotal}</strong> ${group.unitSymbol}
              </span>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr class="bg-slate-100/70 text-slate-600 text-[11px] font-semibold uppercase tracking-wider border-b border-slate-200">
                  <th class="py-2 px-3 text-center w-10">#</th>
                  <th class="py-2 px-3">藥品名稱</th>
                  <th class="py-2 px-3 text-right">每次劑量</th>
                  <th class="py-2 px-3 text-center">日次</th>
                  <th class="py-2 px-3 text-right text-emerald-800">換算每日劑量</th>
                  <th class="py-2 px-3 text-right">全期總量</th>
                </tr>
              </thead>
              <tbody>
                ${tableRowsHtml}
              </tbody>
            </table>
          </div>
        `;
        groupsDetailContainer.appendChild(detailCard);
      });

      // 綁定單行複製事件
      document.querySelectorAll('.btnCopyLine').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const textToCopy = e.currentTarget.getAttribute('data-line');
          copyToClipboard(textToCopy, '已複製該分組文字！');
        });
      });

      // 綁定複製全部按鈕
      btnCopyAll.onclick = () => {
        const fullText = allTextLines.join('\n');
        copyToClipboard(fullText, '已複製全部處方分組文字！');
      };
    }

    // 複製工具函式
    function copyToClipboard(text, successMsg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg);
        }).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (err) {
        showToast('複製失敗，請手動複製');
      }
      document.body.removeChild(textarea);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-20');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-20');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
